<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Lead Capture Popup</title>
  <!-- Optional: Include Inter Font for beautiful typography matching global-form.js -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Firebase SDK Import Map -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .test-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    .btn-primary {
      background: #f97316;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.2);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: #ea580c;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="test-container">
    <h2>Lead Capture Popup Verification</h2>
    <p style="color: #64748b; margin-bottom: 30px;">Click the button below to test the independent global popup form.</p>
    <button class="btn-primary open-register-modal">REGISTER FOR TASC</button>
  </div>

  <!-- Load Global Lead Form Script -->
  <script type="module" src="global-form.js"></script>

</body>
</html>
