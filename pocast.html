  <meta charset="UTF-8">

  <title>YouTube Latest Videos (No Shorts)</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }
    .video {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
    }
    a {
      color: #4ea3ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h2>Latest Videos (Excluding Shorts)</h2>
<div id="videos"></div>

<script>
  const RSS_URL = "https://www.youtube.com/feeds/videos.xml?channel_id=UCHsytOG-7i57hrSwB7fNkcw";

  async function loadVideos() {
    const res = await fetch(RSS_URL);
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const entries = Array.from(xml.querySelectorAll("entry"));

    // FILTER OUT SHORTS BASED ON URL PATTERN
    const normalVideos = entries.filter(entry => {
      const link = entry.querySelector("link").getAttribute("href");
      return link.includes("/watch?v="); // not a short
    });

    const container = document.getElementById("videos");
    container.innerHTML = "";

    normalVideos.forEach(entry => {
      const title = entry.querySelector("title").textContent;
      const link = entry.querySelector("link").getAttribute("href");

      const div = document.createElement("div");
      div.className = "video";
      div.innerHTML = `
        <h3>${title}</h3>
        <a href="${link}" target="_blank">${link}</a>
      `;
      container.appendChild(div);
    });
  }

  loadVideos();
</script>

</body>
