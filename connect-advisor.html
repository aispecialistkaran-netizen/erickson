  <title>Connect with an Advisor - Erickson Coaching International India</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="global.css" rel="stylesheet">
  <link href="connect-advisor.css" rel="stylesheet">
</head>
<body>
  <!-- Connect with an Advisor Section -->
  <section class="advisor-section">
    <div class="advisor-container">
      <div class="advisor-header" data-aos="fade-up" data-aos-duration="800">
        <h2 class="advisor-title">CONNECT WITH AN ADVISOR</h2>
        <p class="advisor-subtitle">
          Our experienced advisors are here to guide you through your coaching journey. 
          Connect with them to learn more about our programs and how Erickson Coaching 
          International can help you achieve your goals.
        </p>
      </div>
      
      <div id="advisor-grid" class="advisor-grid">
        <!-- Team member cards will be dynamically generated here -->
      </div>
    </div>
  </section>

  <!-- AOS Animation Library Initialization -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      AOS.init({
        once: true,
        duration: 800,
        easing: 'ease-in-out'
      });
    });
  </script>
  
  <!-- Advisor Script -->
  <script src="connect-advisor.js" type="module"></script>
</body>
